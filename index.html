<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>清廉家风盲盒 · 武义县妇联</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; min-height: 100vh; overflow-x: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #fef9f0 0%, #fdf3e3 40%, #fef9f0 100%);
  color: #3d2e1e;
  display: flex; justify-content: center; align-items: flex-start;
  min-height: 100vh; padding: 0 16px 60px;
}
.app { width: 100%; max-width: 420px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 48px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 36px; }
.brand-logo-img { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.brand-text { font-size: 13px; color: #8b7355; letter-spacing: 1px; }
.section { display: none; width: 100%; flex-direction: column; align-items: center; }
.section.active { display: flex; }
.hero-title { font-size: 30px; font-weight: 800; text-align: center; line-height: 1.35; margin-bottom: 8px; background: linear-gradient(135deg, #c41e3a 20%, #8b1a2b 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-sub { font-size: 15px; color: #8b7355; text-align: center; margin-bottom: 44px; letter-spacing: 0.5px; }
.box-scene { position: relative; width: 200px; height: 200px; margin-bottom: 36px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.box-scene.shaking .box-body { animation: shake 0.6s ease-in-out; }
.box-scene.opening .box-lid { animation: lidOpen 0.8s ease-in-out forwards; }
.box-scene.opening .box-body { animation: bodyGlow 0.8s ease-in-out forwards; }
.box-body { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 110px; background: linear-gradient(180deg, #d63447 0%, #b21c2e 60%, #8b1524 100%); border-radius: 14px; box-shadow: 0 8px 32px rgba(180,30,50,0.35), inset 0 -4px 8px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; transition: box-shadow 0.4s; }
.box-body::after { content: ''; position: absolute; top: 14px; left: 14px; right: 14px; height: 3px; background: rgba(255,255,255,0.25); border-radius: 2px; }
.box-ribbon-v { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 24px; height: 100%; background: linear-gradient(180deg, rgba(255,215,0,0.6) 0%, rgba(201,169,110,0.5) 100%); border-radius: 4px; }
.box-ribbon-h { position: absolute; top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 18px; background: linear-gradient(90deg, rgba(255,215,0,0.5) 0%, rgba(201,169,110,0.6) 20%, rgba(255,215,0,0.5) 50%, rgba(201,169,110,0.6) 80%, rgba(255,215,0,0.5) 100%); border-radius: 2px; }
.box-question { position: relative; z-index: 2; color: #fff; font-size: 42px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.box-lid { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 152px; height: 48px; background: linear-gradient(180deg, #e8475b 0%, #c41e3a 100%); border-radius: 14px 14px 6px 6px; box-shadow: 0 4px 16px rgba(180,30,50,0.3); z-index: 3; }
.box-lid::after { content: ''; position: absolute; bottom: 6px; left: 16px; right: 16px; height: 2px; background: rgba(255,255,255,0.2); border-radius: 2px; }
.box-sparkles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.box-scene.opening .box-sparkles { opacity: 1; }
.sparkle { position: absolute; width: 6px; height: 6px; background: #ffd700; border-radius: 50%; animation: sparkleFloat 1.2s ease-out forwards; }
.sparkle:nth-child(1) { top: 20%; left: 10%; animation-delay: 0.1s; }
.sparkle:nth-child(2) { top: 10%; left: 30%; animation-delay: 0.3s; }
.sparkle:nth-child(3) { top: 5%; right: 25%; animation-delay: 0.15s; }
.sparkle:nth-child(4) { top: 15%; right: 10%; animation-delay: 0.35s; }
.sparkle:nth-child(5) { top: 30%; left: 15%; animation-delay: 0.25s; }
.sparkle:nth-child(6) { top: 25%; right: 20%; animation-delay: 0.05s; }
.sparkle:nth-child(7) { top: 0%; left: 45%; animation-delay: 0.4s; }
.sparkle:nth-child(8) { top: 8%; right: 40%; animation-delay: 0.2s; }
@keyframes shake { 0%, 100% { transform: translateX(-50%) rotate(0); } 15% { transform: translateX(-50%) rotate(-4deg); } 30% { transform: translateX(-50%) rotate(3deg); } 45% { transform: translateX(-50%) rotate(-3deg); } 60% { transform: translateX(-50%) rotate(2deg); } 75% { transform: translateX(-50%) rotate(-1deg); } }
@keyframes lidOpen { 0% { transform: translateX(-50%) translateY(0) rotate(0); } 50% { transform: translateX(-50%) translateY(-60px) rotate(-10deg); } 100% { transform: translateX(-50%) translateY(-120px) rotate(-15deg); opacity: 0.6; } }
@keyframes bodyGlow { 0% { box-shadow: 0 8px 32px rgba(180,30,50,0.35); } 50% { box-shadow: 0 8px 48px rgba(255,215,0,0.5), 0 0 60px rgba(255,200,0,0.3); } 100% { box-shadow: 0 8px 32px rgba(180,30,50,0.35); } }
@keyframes sparkleFloat { 0% { transform: translateY(0) scale(1); opacity: 1; } 50% { transform: translateY(-40px) scale(1.8); opacity: 0.8; } 100% { transform: translateY(-80px) scale(0); opacity: 0; } }
.box-hint { font-size: 14px; color: #b8936e; text-align: center; animation: hintPulse 2s ease-in-out infinite; margin-bottom: 8px; }
@keyframes hintPulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
.task-card { width: 100%; background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 2px 20px rgba(0,0,0,0.06); text-align: center; position: relative; overflow: hidden; }
.task-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #c41e3a, #d4a853, #c41e3a); }
.task-emoji { font-size: 56px; margin-bottom: 16px; }
.task-title { font-size: 22px; font-weight: 700; color: #3d2e1e; margin-bottom: 8px; }
.task-desc { font-size: 14px; color: #8b7355; line-height: 1.6; margin-bottom: 28px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 28px; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all 0.2s; padding: 14px 40px; letter-spacing: 0.5px; }
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, #c41e3a, #a01830); color: #fff; box-shadow: 0 4px 16px rgba(180,30,50,0.3); width: 100%; }
.btn-outline { background: transparent; color: #c41e3a; border: 1.5px solid #c41e3a; padding: 12px 28px; }
.btn-sm { padding: 10px 24px; font-size: 14px; }
.text-input { width: 100%; border: 1.5px solid #e8d5c0; border-radius: 12px; padding: 14px 16px; font-size: 15px; font-family: inherit; color: #3d2e1e; background: #fefaf6; resize: none; outline: none; transition: border-color 0.2s; line-height: 1.7; }
.text-input:focus { border-color: #c9a96e; }
.three-line { min-height: 100px; }
.one-line { min-height: 60px; }
.char-count { text-align: right; font-size: 12px; color: #b8936e; margin-top: 4px; }
.photo-zone { width: 100%; aspect-ratio: 4/3; max-height: 260px; border: 2px dashed #e0cdb0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fefaf6; cursor: pointer; transition: all 0.2s; overflow: hidden; position: relative; -webkit-tap-highlight-color: transparent; }
.photo-zone:active { border-color: #c9a96e; background: #fdf3e6; }
.photo-zone.has-photo { border-style: solid; border-color: #c9a96e; }
.photo-zone img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
.photo-icon { font-size: 44px; opacity: 0.5; }
.photo-text { font-size: 14px; color: #b8936e; }
.photo-retake { position: absolute; bottom: 12px; right: 12px; background: rgba(0,0,0,0.55); color: #fff; border: none; border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
.quiz-progress { text-align:center; font-size:13px; color:#c41e3a; margin-bottom:12px; font-weight:600; }
.quiz-question { font-size: 16px; font-weight: 600; color: #3d2e1e; margin-bottom: 16px; line-height: 1.6; text-align: left; padding: 12px 16px; background: #fef9f0; border-radius: 10px; border-left: 3px solid #c41e3a; }
.quiz-options { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.quiz-opt { width: 100%; padding: 14px 18px; border: 1.5px solid #e8d5c0; border-radius: 12px; background: #fefaf6; font-size: 15px; color: #3d2e1e; text-align: left; cursor: pointer; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
.quiz-opt:active { background: #fdf3e6; }
.quiz-opt.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
.quiz-opt.wrong { background: #fce4ec; border-color: #e57373; color: #c62828; }
.quiz-feedback { font-size: 14px; margin-top: 12px; text-align: center; }
.quiz-feedback.right { color: #2e7d32; }
.quiz-feedback.wrong { color: #c62828; }
.cert { width: 100%; background: #fff; border: 3px solid #c9a96e; border-radius: 12px; padding: 36px 24px 28px; text-align: center; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
.cert::before { content: ''; position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px; border: 1px solid rgba(201,169,110,0.35); border-radius: 8px; pointer-events: none; }
.cert-stamp { position: absolute; top: 24px; right: 28px; width: 72px; height: 72px; border: 3px solid #c41e3a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #c41e3a; font-size: 22px; font-weight: 800; transform: rotate(-18deg); opacity: 0.8; line-height: 1.2; }
.cert-title { font-size: 26px; font-weight: 800; color: #c41e3a; margin-bottom: 8px; }
.cert-sub { font-size: 14px; color: #8b7355; margin-bottom: 20px; }
.cert-name { font-size: 20px; font-weight: 700; color: #3d2e1e; padding: 6px 0; border-bottom: 2px dashed #d4a853; display: inline-block; margin-bottom: 16px; min-width: 100px; }
.cert-body { font-size: 14px; color: #5c4a3a; line-height: 1.8; }

.reg-form { width: 100%; margin-top: 20px; padding: 20px 16px; background: #fefaf6; border-radius: 12px; border: 1px solid #e8d5c0; }
.reg-form h3 { font-size: 15px; color: #3d2e1e; margin-bottom: 14px; text-align: center; }
.reg-field { margin-bottom: 12px; }
.reg-field label { display: block; font-size: 13px; color: #8b7355; margin-bottom: 4px; }
.reg-field input { width: 100%; padding: 10px 14px; border: 1.5px solid #e8d5c0; border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; background: #fff; transition: border-color 0.2s; }
.reg-field input:focus { border-color: #c9a96e; }
.reg-submit { width: 100%; margin-top: 6px; }
.reg-status { text-align: center; font-size: 13px; margin-top: 8px; display: none; }
.reg-status.success { color: #2e7d32; display: block; }
.reg-status.error { color: #c62828; display: block; }
.cert-gift { margin-top: 20px; padding: 14px 18px; background: linear-gradient(135deg, #fff8e1, #fff3cd); border-radius: 10px; font-size: 14px; color: #8b6914; line-height: 1.7; }
.cert-gift strong { color: #c41e3a; }
.footer { margin-top: 32px; font-size: 12px; color: #c4a882; text-align: center; line-height: 1.6; }
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(0,0,0,0.78); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; pointer-events: none; opacity: 0; transition: all 0.3s; z-index: 100; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.progress-bar { display: flex; gap: 8px; margin-bottom: 24px; }
.progress-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0cdb0; transition: all 0.3s; }
.progress-dot.done { background: #c9a96e; }
.progress-dot.current { background: #c41e3a; transform: scale(1.2); }

.admin-panel { display: none; width: 100%; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 20px rgba(0,0,0,0.06); margin-bottom: 24px; }
.admin-panel.active { display: block; }
.admin-panel h2 { font-size: 20px; font-weight: 700; color: #3d2e1e; margin-bottom: 4px; }
.admin-panel .admin-sub { font-size: 13px; color: #8b7355; margin-bottom: 16px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th { text-align: left; padding: 8px 6px; border-bottom: 2px solid #e8d5c0; color: #8b7355; font-weight: 600; }
.admin-table td { padding: 8px 6px; border-bottom: 1px solid #f0e6d8; color: #3d2e1e; }
.admin-export { margin-top: 16px; }
.admin-empty { text-align: center; color: #b8936e; padding: 24px 0; font-size: 14px; }
.retry-link { margin-top: 24px; font-size: 13px; color: #b8936e; cursor: pointer; text-decoration: underline; -webkit-tap-highlight-color: transparent; }
@media (max-width: 360px) { .app { padding-top: 32px; } .hero-title { font-size: 26px; } .box-scene { width: 170px; height: 170px; } .box-body { width: 120px; height: 94px; } .box-lid { width: 132px; height: 42px; } .cert-stamp { width: 60px; height: 60px; font-size: 18px; top: 18px; right: 18px; } }
</style>
</head>
<body>
<div class="app">
  <section class="section" id="admin">
    <div class="admin-panel">
      <h2>📋 活动数据管理</h2>
      <p class="admin-sub">所有参与者提交的数据（仅供管理查看）</p>
      <div id="adminContent"></div>
      <button class="btn btn-primary btn-sm admin-export" onclick="exportCSV()">⬇ 导出 CSV</button>
      <button class="btn btn-outline btn-sm" style="margin-top:8px;width:100%" onclick="clearData()">清空数据</button>
    </div>
    <div class="retry-link" onclick="resetAll()" style="margin-top:16px">返回活动页面</div>
  </section>
  <section class="section active" id="cover">
    <div class="brand"><img src="logo.jpg" alt="武义县妇联" class="brand-logo-img"><span class="brand-text">武义县妇女联合会</span></div>
    <h1 class="hero-title">清廉家风<br>盲盒</h1>
    <p class="hero-sub">拆一个盲盒，接一份家风任务</p>
    <div class="box-scene" id="blindBox" onclick="openBox()">
      <div class="box-lid"></div>
      <div class="box-body"><div class="box-ribbon-v"></div><div class="box-ribbon-h"></div><span class="box-question">?</span></div>
      <div class="box-sparkles"><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div><div class="sparkle"></div></div>
    </div>
    <p class="box-hint">👆 点我拆盲盒</p>
    <div class="retry-link" onclick="resetAll()" style="display:none" id="retryLink">再拆一次</div>
  </section>
  <section class="section" id="task">
    <div class="progress-bar"><div class="progress-dot current"></div><div class="progress-dot"></div><div class="progress-dot"></div></div>
    <div class="task-card" id="taskCard"></div>
    <div class="retry-link" onclick="resetAll()" style="margin-top:20px">重新选择任务</div>
  </section>
  <section class="section" id="certSection">
    <div class="progress-bar"><div class="progress-dot done"></div><div class="progress-dot done"></div><div class="progress-dot current"></div></div>
    <div class="cert" id="certContent"></div>
    <div class="retry-link" onclick="resetAll()" style="margin-top:20px">再来一次</div>
  </section>
  <div class="footer">武义县妇女联合会 · 清廉家风主题活动<br>完成任意任务即可凭此页面来妇联领取精美礼品一份</div>
</div>
<div class="toast" id="toast"></div>
<script>
const TASKS=[{id:1,type:'photo',emoji:'📷',title:'拍下你家的"清廉一角"',desc:'可以是一幅家风家训字画、一张全家福、一个用了多年的老物件——只要是能体现节俭、正直、清廉家风的角落都可以。',hint:'拍照上传'},{id:2,type:'text3',emoji:'✍️',title:'三行家书',desc:'请写下三行短家书，主题围绕清廉、正直、节俭。不用多，三行刚刚好。',hint:'写三行文字',placeholder:'第一行...\n第二行...\n第三行...'},{id:3,type:'text1',emoji:'🏠',title:'晒晒你家的"小规矩"',desc:'很多家庭都有不成文的小规矩——"不浪费一粒米""别人的东西不能拿""答应的事要做到"。你家有没有？',hint:'写一句话',placeholder:'我家的规矩是...'},{id:4,type:'quiz',emoji:'📖',title:'清廉知识小考（一）',desc:'回答3道清廉知识题，全部完成即可通关~',hint:'答题',questions:[{q:'包拯被民间尊称为什么？',opts:['包青天','包大人','包丞相','包公'],ans:0},{q:'明代哪位清官去世时家无余财，仅留几件破衣？',opts:['于谦','海瑞','张居正','戚继光'],ans:1},{q:'一钱太守指的是哪位东汉清官？',opts:['杨震','刘宠','董宣','张堪'],ans:1}]},{id:5,type:'photo',emoji:'👨‍👩‍👧‍👦',title:'拍一张全家福',desc:'上传一张全家福，并告诉我们家人给过你什么让你受用至今的教诲。',hint:'上传全家福'},{id:6,type:'text1',emoji:'💬',title:'父母常说的一句廉洁叮嘱',desc:'分享一句你父母（或长辈）常挂在嘴边的廉洁叮嘱，那句让你一直记在心里的话。',hint:'写一句话',placeholder:'爸妈常说...'},{id:7,type:'photo',emoji:'🧹',title:'拍下最能代表"勤俭"的物品',desc:'家里有没有什么东西最能代表勤俭节约？可能是补了又补的衣服、用了十几年的锅、或是孩子用旧本子做的草稿纸。',hint:'拍照上传'},{id:8,type:'quiz',emoji:'🧠',title:'清廉知识小考（二）',desc:'回答3道清廉知识题，全部完成即可通关~',hint:'答题',questions:[{q:'"粉身碎骨浑不怕，要留清白在人间"出自谁的诗？',opts:['文天祥','岳飞','于谦','陆游'],ans:2},{q:'"先天下之忧而忧，后天下之乐而乐"出自谁的名篇？',opts:['苏轼','欧阳修','范仲淹','王安石'],ans:2},{q:'"出淤泥而不染，濯清涟而不妖"描写的是什么花？',opts:['梅花','兰花','菊花','莲花'],ans:3}]},{id:9,type:'text3',emoji:'🌿',title:'写给你孩子（或未来的孩子）的一封清廉短信',desc:'如果只能用三句话告诉孩子什么是清廉、正直，你会说什么？',hint:'写三行文字',placeholder:'孩子，我想对你说...\n...\n...'},{id:10,type:'text1',emoji:'🪞',title:'一句家风座右铭',desc:'用一句话概括你家的家风，可以是你自创的，也可以是祖辈传下来的。',hint:'写一句话',placeholder:'我家的家风是...'}];
let currentTask=null,completed=false,photoData=null;
function showSection(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function resetAll(){currentTask=null;completed=false;photoData=null;const box=document.getElementById('blindBox');box.classList.remove('shaking','opening');document.getElementById('retryLink').style.display='none';showSection('cover');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timeout);t._timeout=setTimeout(()=>t.classList.remove('show'),1800);}
function openBox(){if(currentTask)return;const box=document.getElementById('blindBox');const idx=Math.floor(Math.random()*TASKS.length);currentTask=TASKS[idx];box.classList.add('shaking');box.addEventListener('animationend',function h(){box.removeEventListener('animationend',h);box.classList.remove('shaking');box.classList.add('opening');box.addEventListener('animationend',function h2(){box.removeEventListener('animationend',h2);document.getElementById('retryLink').style.display='block';showTask();},{once:true});},{once:true});}
function showTask(){const card=document.getElementById('taskCard');const t=currentTask;let html=`<div class="task-emoji">${t.emoji}</div><h2 class="task-title">${t.title}</h2><p class="task-desc">${t.desc}</p>`;if(t.type==='photo')html+=renderPhotoTask();else if(t.type==='text3')html+=renderTextTask(t,'three-line',100);else if(t.type==='text1')html+=renderTextTask(t,'one-line',60);else if(t.type==='quiz')html+=renderQuizTask(t);card.innerHTML=html;showSection('task');completed=false;setTimeout(()=>{if(t.type==='photo')bindPhoto();if(t.type==='quiz')bindQuiz(t);const ta=card.querySelector('textarea');if(ta)bindTextarea(ta);},50);}
function renderPhotoTask(){return `<div class="photo-zone" id="photoZone" onclick="document.getElementById('photoInput').click()"><span class="photo-icon">📸</span><span class="photo-text">点击拍照或选择图片</span><input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none"></div><button class="btn btn-primary btn-sm" style="margin-top:20px" onclick="submitPhoto()" id="photoSubmitBtn" disabled>提交照片</button>`;}
function renderTextTask(t,cls,maxLen){return `<textarea class="text-input ${cls}" id="textInput" placeholder="${t.placeholder||'请输入...'}" maxlength="${maxLen}"></textarea><div class="char-count"><span id="charCount">0</span>/${maxLen}</div><button class="btn btn-primary btn-sm" style="margin-top:16px" onclick="submitText()" id="textSubmitBtn" disabled>提交</button>`;}
function renderQuizTask(t){let html='';if(t.questions){window._quizData=t;window._quizIdx=0;var q=t.questions[0];html+='<div class="quiz-progress">第 <span id="qN">1</span>/'+t.questions.length+' 题</div>';html+='<div class="quiz-question" id="qText">'+q.q+'</div>';html+='<div class="quiz-options" id="qOpts">';q.opts.forEach(function(o,i){html+='<button class="quiz-opt" data-i="'+i+'">'+o+'</button>';});html+='</div>';html+='<div class="quiz-feedback" id="quizFeedback"></div>';}else{html+='<div class="quiz-question">'+t.question+'</div>';html+='<div class="quiz-options">';t.options.forEach(function(opt,i){html+='<button class="quiz-opt" data-idx="'+i+'">'+opt+'</button>';});html+='</div><div class="quiz-feedback" id="quizFeedback"></div>';}return html;}
function bindPhoto(){document.getElementById('photoInput').onchange=(e)=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=(ev)=>{photoData=ev.target.result;const zone=document.getElementById('photoZone');zone.classList.add('has-photo');zone.innerHTML=`<img src="${photoData}" alt="uploaded photo"><button class="photo-retake" onclick="event.stopPropagation();retakePhoto()">重新拍摄</button>`;document.getElementById('photoSubmitBtn').disabled=false;};reader.readAsDataURL(file);};}
function retakePhoto(){photoData=null;const zone=document.getElementById('photoZone');zone.classList.remove('has-photo');zone.innerHTML='<span class="photo-icon">📸</span><span class="photo-text">点击拍照或选择图片</span>';document.getElementById('photoSubmitBtn').disabled=true;bindPhoto();}
function submitPhoto(){if(!photoData)return;finishTask();}
function bindTextarea(ta){const counter=document.getElementById('charCount');const btn=document.getElementById('textSubmitBtn');ta.oninput=()=>{if(counter)counter.textContent=ta.value.length;if(btn)btn.disabled=ta.value.trim().length===0;};}
function submitText(){const ta=document.getElementById('textInput');if(!ta||ta.value.trim().length===0){showToast('请先写点东西吧~');return;}finishTask();}
function bindMultiQuiz(t){var opts=document.querySelectorAll('#qOpts .quiz-opt');var answered=false;opts.forEach(function(btn){btn.onclick=function(){if(answered)return;answered=true;var i=parseInt(btn.dataset.i);var q=t.questions[window._quizIdx];var fb=document.getElementById('quizFeedback');var correct=i===q.ans;btn.classList.add(correct?'correct':'wrong');if(!correct){opts[q.ans].classList.add('correct');}fb.className='quiz-feedback '+(correct?'right':'wrong');fb.textContent=correct?'✅ 回答正确！':('正确答案是：'+q.opts[q.ans]);window._quizIdx++;if(window._quizIdx>=t.questions.length){setTimeout(function(){fb.textContent='🎉 全部完成！真有学问~';setTimeout(function(){finishTask();},1200);},1500);}else{setTimeout(function(){var nq=t.questions[window._quizIdx];document.getElementById('qN').textContent=window._quizIdx+1;document.getElementById('qText').textContent=nq.q;var oh='';nq.opts.forEach(function(o,j){oh+='<button class="quiz-opt" data-i="'+j+'">'+o+'</button>';});document.getElementById('qOpts').innerHTML=oh;document.getElementById('quizFeedback').textContent='';document.getElementById('quizFeedback').className='quiz-feedback';setTimeout(function(){bindMultiQuiz(t);},100);},1500);}};});}function bindQuiz(t){if(t.questions){bindMultiQuiz(t);return;}var opts=document.querySelectorAll('.quiz-opt');var answered=false;opts.forEach(function(btn){btn.onclick=function(){if(answered)return;answered=true;var idx=parseInt(btn.dataset.idx);var fb=document.getElementById('quizFeedback');if(idx===t.answer){btn.classList.add('correct');fb.className='quiz-feedback right';fb.textContent='✅ 答对了！真有学问~';setTimeout(function(){finishTask();},1200);}else{btn.classList.add('wrong');opts[t.answer].classList.add('correct');fb.className='quiz-feedback wrong';fb.textContent='正确答案是：'+t.options[t.answer]+'。也算你完成任务啦~';setTimeout(function(){finishTask();},2000);}};});}function bindMultiQuiz(t){var opts=document.querySelectorAll('#qOpts .quiz-opt');var answered=false;opts.forEach(function(btn){btn.onclick=function(){if(answered)return;answered=true;var i=parseInt(btn.dataset.i);var q=t.questions[window._quizIdx];var fb=document.getElementById('quizFeedback');var correct=i===q.ans;btn.classList.add(correct?'correct':'wrong');if(!correct){opts[q.ans].classList.add('correct');}fb.className='quiz-feedback '+(correct?'right':'wrong');fb.textContent=correct?'✅ 回答正确！':('正确答案是：'+q.opts[q.ans]);window._quizIdx++;if(window._quizIdx>=t.questions.length){setTimeout(function(){fb.textContent='🎉 全部完成！真有学问~';setTimeout(function(){finishTask();},1200);},1500);}else{setTimeout(function(){var nq=t.questions[window._quizIdx];document.getElementById('qN').textContent=window._quizIdx+1;document.getElementById('qText').textContent=nq.q;var oh='';nq.opts.forEach(function(o,j){oh+='<button class="quiz-opt" data-i="'+j+'">'+o+'</button>';});document.getElementById('qOpts').innerHTML=oh;document.getElementById('quizFeedback').textContent='';document.getElementById('quizFeedback').className='quiz-feedback';setTimeout(function(){bindMultiQuiz(t);},100);},1500);}};});}
function finishTask(){if(completed)return;completed=true;showToast('任务完成！🎉');setTimeout(()=>showCert(),600);}
function showCert(){const cert=document.getElementById('certContent');const now=new Date();const dateStr=now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日';cert.innerHTML=`<div class="cert-stamp">已完成</div><div class="cert-title">🏅 清廉家风达人</div><div class="cert-sub">武义县妇女联合会</div><div class="cert-name">亲爱的参与者</div><div class="cert-body">感谢你参与"清廉家风盲盒"主题活动！<br>你已完成任务：<strong>${currentTask.title}</strong><br><span style="font-size:12px;color:#b8936e">完成时间：${dateStr}</span></div><div class="cert-gift">🎁 <strong>恭喜！</strong><br>凭此页面截图，可到<strong>武义县妇联</strong>领取<br>精美清廉家风主题礼品一份</div>`;
  var regHTML = '<div class="reg-form" id="regForm"><h3>📝 登记领奖信息</h3>';
  regHTML += '<div class="reg-field"><label>姓名</label><input type="text" id="regName" placeholder="请输入您的姓名"></div>';
  regHTML += '<div class="reg-field"><label>手机号</label><input type="tel" id="regPhone" placeholder="请输入手机号"></div>';
  regHTML += '<button class="btn btn-primary btn-sm reg-submit" onclick="submitRegistration()">提交信息</button>';
  regHTML += '<div class="reg-status" id="regStatus"></div></div>';
  cert.innerHTML += regHTML;
  showSection('certSection');
}

document.addEventListener('DOMContentLoaded',()=>{showSection('cover');});

var API_ENDPOINT = '';
function submitRegistration(){
  var name = document.getElementById('regName').value.trim();
  var phone = document.getElementById('regPhone').value.trim();
  var status = document.getElementById('regStatus');
  if(!name || !phone){ status.className='reg-status error'; status.textContent='请填写姓名和手机号'; return; }
  if(!/^1[3-9]\d{9}$/.test(phone)){ status.className='reg-status error'; status.textContent='请输入正确的手机号'; return; }
  var record = { name: name, phone: phone, task: currentTask.title, taskType: currentTask.type, time: new Date().toLocaleString('zh-CN'), timestamp: Date.now() };
  var submissions = JSON.parse(localStorage.getItem('ql_submissions') || '[]');
  submissions.push(record);
  localStorage.setItem('ql_submissions', JSON.stringify(submissions));
  if(API_ENDPOINT){
    fetch(API_ENDPOINT, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(record) })
    .then(function(r){ return r.json(); })
    .then(function(){ status.className='reg-status success'; status.textContent='✅ 提交成功！凭此页面来妇联领奖~'; document.getElementById('regForm').style.display='none'; })
    .catch(function(){ status.className='reg-status error'; status.textContent='网络提交失败，但数据已本地保存'; });
  } else {
    status.className='reg-status success'; status.textContent='✅ 提交成功！凭此页面来妇联领奖~';
    document.getElementById('regForm').style.display='none';
  }
}
function renderAdmin(){
  var subs = JSON.parse(localStorage.getItem('ql_submissions') || '[]');
  var c = document.getElementById('adminContent');
  if(subs.length === 0){ c.innerHTML='<div class="admin-empty">暂无提交数据</div>'; return; }
  var h = '<table class="admin-table"><tr><th>姓名</th><th>手机号</th><th>任务</th><th>时间</th></tr>';
  subs.reverse().forEach(function(s){ h += '<tr><td>'+s.name+'</td><td>'+s.phone+'</td><td style="font-size:12px">'+s.task+'</td><td style="font-size:11px">'+s.time+'</td></tr>'; });
  h += '</table><div style="margin-top:10px;font-size:13px;color:#8b7355">共 '+subs.length+' 条记录</div>';
  c.innerHTML = h;
}
function exportCSV(){
  var subs = JSON.parse(localStorage.getItem('ql_submissions') || '[]');
  if(subs.length === 0){ showToast('暂无数据可导出'); return; }
  var csv = '\uFEFF姓名,手机号,任务,任务类型,时间\n';
  subs.forEach(function(s){ csv += '"'+s.name+'","'+s.phone+'","'+s.task+'","'+s.taskType+'","'+s.time+'"\n'; });
  var blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'data.csv'; a.click();
  showToast('CSV 已下载');
}
function clearData(){
  if(confirm('确定清空所有数据？')){ localStorage.removeItem('ql_submissions'); renderAdmin(); showToast('已清空'); }
}
if(window.location.search.indexOf('admin') !== -1){
  document.addEventListener('DOMContentLoaded', function(){ document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); }); document.getElementById('admin').classList.add('active'); document.querySelector('.admin-panel').classList.add('active'); renderAdmin(); });
}
